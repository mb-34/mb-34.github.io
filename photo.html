<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mistress Beren | Photos</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f3f4f6; color: #1f2937; display: flex; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; }
        
        .navbar { display: flex; gap: 15px; margin-bottom: 40px; background: #ffffff; padding: 10px 20px; border-radius: 30px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .navbar a { text-decoration: none; color: #6b7280; font-weight: 600; padding: 8px 16px; border-radius: 20px; transition: all 0.3s ease; font-size: 0.95rem; }
        .navbar a:hover { color: #111827; background-color: #f3f4f6; }
        .navbar a.active { color: #ffffff; background-color: #111827; }

        .gallery-container { width: 100%; max-width: 800px; display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .gallery-item { width: 100%; height: 300px; background-color: #e5e7eb; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease; }
        .gallery-item img:hover { transform: scale(1.05); }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html">Links</a>
        <a href="about.html">About Me</a>
        <a href="photo.html" class="active">Photos</a>
    </nav>

    <div class="gallery-container">
        <!-- Klasörüne ekleyeceğin fotoların isimlerini buraya yazmalısın. Örnek: -->
        <div class="gallery-item"><img src="1.jpg" alt="Galeri 1"></div>
        <div class="gallery-item"><img src="2.jpg" alt="Galeri 2"></div>
        <div class="gallery-item"><img src="3.jpg" alt="Galeri 3"></div>
         <div class="gallery-item"><img src="4.jpg" alt="Galeri 4"></div>
        <div class="gallery-item"><img src="5.jpg" alt="Galeri 5"></div>
        <div class="gallery-item"><img src="6.jpg" alt="Galeri 6"></div>
        <div class="gallery-item"><img src="7.jpg" alt="Galeri 7"></div>
        <div class="gallery-item"><img src="8.jpg" alt="Galeri 8"></div>
        <div class="gallery-item"><img src="9.jpg" alt="Galeri 9"></div>
    </div>

</body>
</html>
